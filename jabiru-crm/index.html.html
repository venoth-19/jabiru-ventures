<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jabiru Ventures — CRM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0f1117;
    --bg2: #181c27;
    --bg3: #1e2333;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #e8eaf0;
    --text2: #8b90a0;
    --text3: #555a6e;
    --green: #1dd37f;
    --green2: #0f7a49;
    --green-bg: rgba(29,211,127,0.1);
    --purple: #7c6ef7;
    --purple-bg: rgba(124,110,247,0.12);
    --amber: #f5a623;
    --amber-bg: rgba(245,166,35,0.1);
    --red: #f55a5a;
    --red-bg: rgba(245,90,90,0.1);
    --blue: #5ab4f5;
    --blue-bg: rgba(90,180,245,0.1);
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  /* HEADER */
  .header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-mark {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--green); display: flex; align-items: center;
    justify-content: center; font-size: 16px; font-weight: 600; color: #0f1117;
  }
  .logo-name { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .logo-sub { font-size: 11px; color: var(--text2); }
  .add-btn {
    background: var(--green); color: #0f1117; border: none;
    padding: 8px 14px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; display: flex; align-items: center; gap: 6px;
  }
  .add-btn:active { opacity: 0.85; transform: scale(0.97); }

  /* STATS BAR */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 14px 16px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    background: var(--bg3);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    border: 1px solid var(--border);
  }
  .stat-val { font-size: 18px; font-weight: 600; font-family: 'DM Mono', monospace; }
  .stat-lbl { font-size: 10px; color: var(--text2); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* FILTERS */
  .filters {
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }
  .search-wrap { position: relative; }
  .search-wrap input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 9px 12px 9px 36px;
    outline: none;
    transition: border-color .2s;
  }
  .search-wrap input:focus { border-color: var(--green); }
  .search-wrap input::placeholder { color: var(--text3); }
  .search-icon {
    position: absolute; left: 11px; top: 50%;
    transform: translateY(-50%);
    color: var(--text3); font-size: 14px;
  }
  .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .filter-row::-webkit-scrollbar { display: none; }
  select {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    padding: 7px 10px;
    outline: none;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    appearance: none;
    -webkit-appearance: none;
    min-width: 110px;
  }
  select:focus { border-color: var(--green); }

  /* CONTENT */
  .content { padding: 14px 16px; }

  .section-header {
    display: flex; align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-title { font-size: 13px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: 0.6px; }
  .count-badge {
    font-size: 11px; padding: 2px 8px;
    border-radius: 20px; background: var(--bg3);
    border: 1px solid var(--border); color: var(--text2);
    font-family: 'DM Mono', monospace;
  }

  /* CUSTOMER CARDS */
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .ccard {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    cursor: pointer;
    transition: border-color .15s, transform .1s;
  }
  .ccard:active { transform: scale(0.99); border-color: var(--border2); }
  .ccard-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .ccard-left { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; flex-shrink: 0;
  }
  .cname { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
  .cphone { font-size: 12px; color: var(--text2); font-family: 'DM Mono', monospace; }
  .ccard-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag {
    font-size: 11px; padding: 3px 9px; border-radius: 20px;
    font-weight: 500; white-space: nowrap;
  }
  .tag-malay   { background: var(--green-bg); color: var(--green); }
  .tag-chinese { background: var(--red-bg); color: var(--red); }
  .tag-indian  { background: var(--amber-bg); color: var(--amber); }
  .tag-others  { background: var(--bg3); color: var(--text2); }
  .tag-condo   { background: var(--purple-bg); color: var(--purple); }
  .tag-landed  { background: var(--amber-bg); color: var(--amber); }
  .tag-apartment { background: var(--blue-bg); color: var(--blue); }
  .tag-commercial { background: var(--red-bg); color: var(--red); }
  .tag-gen     { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }

  .ccard-bottom {
    display: flex; align-items: center;
    justify-content: space-between;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    margin-top: 2px;
  }
  .job-info { display: flex; align-items: center; gap: 6px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .job-status { font-size: 12px; color: var(--text2); }
  .job-price { font-size: 13px; font-weight: 600; font-family: 'DM Mono', monospace; color: var(--green); }

  /* STATUS COLORS */
  .s-lead      { background: var(--text3); }
  .s-won       { background: var(--green); }
  .s-booked    { background: var(--blue); }
  .s-inspected { background: var(--amber); }
  .s-completed { background: var(--purple); }
  .s-cancelled { background: var(--red); }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 600px;
    max-height: 92vh;
    overflow-y: auto;
    padding: 20px 18px 32px;
    animation: slideUp .25s ease;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 18px; }
  .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 18px; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12px; color: var(--text2); margin-bottom: 6px; display: block; font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; }
  .form-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    transition: border-color .2s;
  }
  .form-input:focus { border-color: var(--green); }
  .form-input::placeholder { color: var(--text3); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-section { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin: 18px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .submit-btn {
    width: 100%; background: var(--green); color: #0f1117;
    border: none; border-radius: var(--radius-sm);
    padding: 13px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit; margin-top: 6px;
    transition: opacity .15s;
  }
  .submit-btn:active { opacity: 0.85; }
  .cancel-btn {
    width: 100%; background: transparent; color: var(--text2);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 11px; font-size: 13px; cursor: pointer;
    font-family: inherit; margin-top: 8px;
  }

  /* DETAIL MODAL */
  .detail-section { margin-bottom: 16px; }
  .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .detail-row:last-child { border-bottom: none; }
  .detail-key { font-size: 12px; color: var(--text2); }
  .detail-val { font-size: 13px; font-weight: 500; text-align: right; }
  .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .action-btn {
    padding: 10px; border-radius: var(--radius-sm);
    font-size: 12px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--border); font-family: inherit;
    background: var(--bg3); color: var(--text);
    transition: background .15s;
  }
  .action-btn:active { background: var(--bg2); }
  .action-btn.primary { background: var(--green-bg); color: var(--green); border-color: rgba(29,211,127,0.2); }

  .empty { text-align: center; padding: 48px 20px; color: var(--text3); }
  .empty-icon { font-size: 36px; margin-bottom: 10px; }
  .empty-text { font-size: 14px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--green); color: #0f1117;
    padding: 10px 20px; border-radius: 20px;
    font-size: 13px; font-weight: 600;
    z-index: 999; opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  @media (min-width: 600px) {
    .stats-bar { grid-template-columns: repeat(4, 1fr); }
    .modal { border-radius: 16px; margin-bottom: 20px; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">

      <div class="logo-name">Jabiru Ventures</div>

<script>
// ============================================
// CONFIGURATION — paste your Supabase details
// ============================================
const SUPABASE_URL = 'https://siglqixiefvrxfvpxttj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_3LA7_L8nCwysXKAI7-0Faw_v6m7iTL_';

// ============================================
// SUPABASE CLIENT (lightweight, no SDK needed)
// ============================================
const sb = {
  async query(table, params = {}) {
    let url = `${SUPABASE_URL}/rest/v1/${table}?`;
    const q = [];
    if (params.select) q.push(`select=${params.select}`);
    if (params.filter) Object.entries(params.filter).forEach(([k,v]) => q.push(`${k}=eq.${v}`));
    if (params.order) q.push(`order=${params.order}`);
    url += q.join('&');
    const res = await fetch(url, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json'
      }
    });
    return res.json();
  },
  async insert(table, data) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: JSON.stringify(data)
    });
    return res.json();
  },
  async update(table, id, data) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: JSON.stringify(data)
    });
    return res.json();
  }
};

// ============================================
// STATE
// ============================================
let allData = [];
let filtered = [];

// ============================================
// LOAD DATA
// ============================================
async function loadData() {
  try {
    const [customers, properties, jobs] = await Promise.all([
      sb.query('customers', { select: '*', order: 'created_at.desc' }),
      sb.query('properties', { select: '*' }),
      sb.query('jobs', { select: '*', order: 'created_at.desc' })
    ]);

    allData = customers.map(c => {
      const props = properties.filter(p => p.customer_id === c.id);
      const job = jobs.filter(j => j.customer_id === c.id).sort((a,b) => new Date(b.created_at) - new Date(a.created_at))[0];
      return { ...c, properties: props, latestJob: job || null };
    });

    populateCityFilter();
    applyFilters();
    updateStats();
  } catch(e) {
    showDemoData();
  }
}

      latestJob:{ status:'Booked', price:1200, invoice_no:'JV-2025-0002', inspection_date:'2025-04-15', report_recipient:'Both' } },

// ============================================
// FILTERS
// ============================================
function populateCityFilter() {
  const cities = [...new Set(allData.flatMap(d => d.properties.map(p => p.city)).filter(Boolean))].sort();
  const sel = document.getElementById('f-city');
  sel.innerHTML = '<option value="">All cities</option>' + cities.map(c => `<option>${c}</option>`).join('');
}

function applyFilters() {
  const search = document.getElementById('search').value.toLowerCase();
  const type = document.getElementById('f-type').value;
  const race = document.getElementById('f-race').value;
  const city = document.getElementById('f-city').value;
  const value = document.getElementById('f-value').value;

  filtered = allData.filter(d => {
    const prop = d.properties[0] || {};
    const job = d.latestJob || {};

    if (search) {
      const haystack = `${d.full_name} ${d.phone} ${prop.address || ''} ${prop.city || ''}`.toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    if (type && prop.property_type !== type) return false;
    if (race && d.race !== race) return false;
    if (city && prop.city !== city) return false;
    if (value && job.price) {
      const p = parseFloat(job.price);
      if (value === '0-500' && p >= 500) return false;
      if (value === '500-1000' && (p < 500 || p >= 1000)) return false;
      if (value === '1000-2000' && (p < 1000 || p >= 2000)) return false;
      if (value === '2000+' && p < 2000) return false;
    }
    return true;
  });

  renderCards();
  document.getElementById('result-count').textContent = filtered.length;
}

// ============================================
// RENDER
// ============================================
function avatarColor(race) {
  const map = { Malay: ['#0f3d24','#1dd37f'], Chinese: ['#3d0f0f','#f55a5a'], Indian: ['#3d2e0f','#f5a623'], Others: ['#1e2333','#8b90a0'] };
  return map[race] || map.Others;
}

function statusClass(s) {
  return { Lead:'s-lead', Won:'s-won', Booked:'s-booked', Inspected:'s-inspected', Completed:'s-completed', Cancelled:'s-cancelled' }[s] || 's-lead';
}

function tagClass(type, val) {
  if (type === 'race') return `tag-${(val||'others').toLowerCase()}`;
  if (type === 'prop') return `tag-${(val||'others').toLowerCase()}`;
  return 'tag-gen';
}

function renderCards() {
  const container = document.getElementById('cards-container');
  const empty = document.getElementById('empty-state');
  if (!filtered.length) { container.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  container.innerHTML = filtered.map(d => {
    const prop = d.properties[0] || {};
    const job = d.latestJob || {};
    const [bg, fg] = avatarColor(d.race);
    const initials = d.full_name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const price = job.price ? `RM${parseFloat(job.price).toLocaleString('en-MY', {minimumFractionDigits:0})}` : '—';
    const status = job.status || 'Lead';

    return `<div class="ccard" onclick="openDetail('${d.id}')">
      <div class="ccard-top">
        <div class="ccard-left">
          <div class="avatar" style="background:${bg};color:${fg}">${initials}</div>
          <div>
            <div class="cname">${d.full_name}</div>
            <div class="cphone">${d.phone}</div>
          </div>
        </div>
      </div>
      <div class="ccard-tags">
        ${d.race ? `<span class="tag ${tagClass('race',d.race)}">${d.race}</span>` : ''}
        ${prop.property_type ? `<span class="tag ${tagClass('prop',prop.property_type)}">${prop.property_type}</span>` : ''}
        ${prop.city ? `<span class="tag tag-gen">${prop.city}</span>` : ''}
        ${d.lead_source ? `<span class="tag tag-gen">${d.lead_source}</span>` : ''}
      </div>
      <div class="ccard-bottom">
        <div class="job-info">
          <div class="status-dot ${statusClass(status)}"></div>
          <span class="job-status">${status}</span>
          ${job.invoice_no ? `<span style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace">${job.invoice_no}</span>` : ''}
        </div>
        <div class="job-price">${price}</div>
      </div>
    </div>`;
  }).join('');
}

function updateStats() {
  const total = allData.length;
  const active = allData.filter(d => d.latestJob && ['Won','Booked','Inspected'].includes(d.latestJob.status)).length;
  const revenue = allData.reduce((sum, d) => sum + (d.latestJob?.status === 'Completed' ? parseFloat(d.latestJob.price||0) : 0), 0);
  const done = allData.filter(d => d.latestJob?.status === 'Completed').length;

  document.getElementById('s-total').textContent = total;
  document.getElementById('s-active').textContent = active;
  document.getElementById('s-revenue').textContent = `RM${revenue.toLocaleString('en-MY',{minimumFractionDigits:0})}`;
  document.getElementById('s-done').textContent = done;
}

// ============================================
// DETAIL VIEW
// ============================================
function openDetail(id) {
  const d = allData.find(x => x.id === id);
  if (!d) return;
  const prop = d.properties[0] || {};
  const job = d.latestJob || {};
  const [bg, fg] = avatarColor(d.race);
  const initials = d.full_name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();

  document.getElementById('detail-content').innerHTML = `
    <div class="modal-handle"></div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px">
      <div class="avatar" style="width:48px;height:48px;font-size:16px;background:${bg};color:${fg}">${initials}</div>
      <div>
        <div style="font-size:16px;font-weight:600">${d.full_name}</div>
        <div style="font-size:12px;color:var(--text2);font-family:'DM Mono',monospace">${d.phone}</div>
      </div>
    </div>
    <div class="detail-section">
      <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">Customer</div>
      ${d.email ? row('Email', d.email) : ''}
      ${d.race ? row('Race', d.race) : ''}
      ${d.lead_source ? row('Source', d.lead_source) : ''}
    </div>
    <div class="detail-section">
      <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">Property</div>
      ${prop.address ? row('Address', prop.address) : ''}
      ${prop.city ? row('City', `${prop.city}, ${prop.state||''}`) : ''}
      ${prop.property_type ? row('Type', prop.property_type) : ''}
      ${prop.developer ? row('Developer', prop.developer) : ''}
    </div>
    ${job.status ? `<div class="detail-section">
      <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">Job</div>
      ${row('Status', `<span style="display:inline-flex;align-items:center;gap:6px"><span class="status-dot ${statusClass(job.status)}" style="display:inline-block"></span>${job.status}</span>`)}
      ${job.invoice_no ? row('Invoice', job.invoice_no) : ''}
      ${job.price ? row('Price', `RM${parseFloat(job.price).toLocaleString('en-MY',{minimumFractionDigits:2})}`) : ''}
      ${job.inspection_date ? row('Date', job.inspection_date) : ''}
      ${job.report_recipient ? row('Report to', job.report_recipient) : ''}
    </div>` : ''}
    <div class="action-btns">
      <button class="action-btn" onclick="callClient('${d.phone}')">Call client</button>
      <button class="action-btn" onclick="whatsappClient('${d.phone}')">WhatsApp</button>
      <button class="action-btn primary" onclick="updateStatus('${id}')">Update status</button>
      <button class="action-btn" onclick="closeModal('detail-modal')">Close</button>
    </div>`;
  document.getElementById('detail-modal').classList.add('open');
}

function row(key, val) {
  return `<div class="detail-row"><span class="detail-key">${key}</span><span class="detail-val">${val}</span></div>`;
}

function callClient(phone) { window.location.href = `tel:${phone}`; }
function whatsappClient(phone) { window.open(`https://wa.me/60${phone.replace(/^0/,'')}`, '_blank'); }

function updateStatus(id) {
  const d = allData.find(x => x.id === id);
  if (!d || !d.latestJob) return;
  const statuses = ['Lead','Won','Booked','Inspected','Completed'];
  const curr = statuses.indexOf(d.latestJob.status);
  const next = statuses[(curr + 1) % statuses.length];
  d.latestJob.status = next;
  renderCards();
  updateStats();
  closeModal('detail-modal');
  showToast(`Status updated to ${next}`);
}

// ============================================
// ADD CLIENT
// ============================================
function openAdd() { document.getElementById('add-modal').classList.add('open'); }

async function saveClient() {
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const addr = document.getElementById('f-addr').value.trim();
  const city = document.getElementById('f-city2').value.trim();
  const state = document.getElementById('f-state').value.trim();

  if (!name || !phone || !addr || !city || !state) {
    showToast('Please fill required fields'); return;
  }

  const newClient = {
    id: Date.now().toString(),
    full_name: name,
    phone,
    email: document.getElementById('f-email').value.trim(),
    race: document.getElementById('f-race2').value,
    lead_source: document.getElementById('f-source').value,
    properties: [{
      address: addr, city, state,
      property_type: document.getElementById('f-proptype').value,
      developer: document.getElementById('f-dev').value.trim()
    }],
    latestJob: {
      status: document.getElementById('f-status').value,
      price: document.getElementById('f-price').value,
      inspection_date: document.getElementById('f-date').value,
      report_recipient: document.getElementById('f-recipient').value,
      invoice_no: `JV-${new Date().getFullYear()}-${String(allData.length+1).padStart(4,'0')}`
    }
  };

  // Try Supabase insert if configured
  if (SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
    try {
      const cust = await sb.insert('customers', { full_name:name, phone, email:newClient.email, race:newClient.race, lead_source:newClient.lead_source });
      if (cust[0]?.id) {
        await sb.insert('properties', { customer_id:cust[0].id, address:addr, city, state, property_type:newClient.properties[0].property_type, developer:newClient.properties[0].developer });
        if (newClient.latestJob.price) await sb.insert('jobs', { customer_id:cust[0].id, status:newClient.latestJob.status, price:newClient.latestJob.price, inspection_date:newClient.latestJob.inspection_date||null, report_recipient:newClient.latestJob.report_recipient });
      }
    } catch(e) { console.log('Supabase insert failed, saving locally', e); }
  }

  allData.unshift(newClient);
  populateCityFilter();
  applyFilters();
  updateStats();
  closeModal('add-modal');
  clearForm();
  showToast(`${name} added successfully`);
}

function clearForm() {
  ['f-name','f-phone','f-email','f-addr','f-city2','f-state','f-dev','f-date','f-price'].forEach(id => document.getElementById(id).value = '');
  ['f-race2','f-source','f-proptype'].forEach(id => document.getElementById(id).selectedIndex = 0);
}

// ============================================
// UTILITIES
// ============================================
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function closeOnOverlay(e, id) { if (e.target.id === id) closeModal(id); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ============================================
// INIT
// ============================================
loadData();
</script>
